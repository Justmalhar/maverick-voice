name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # ── macOS (arm64 DMG, signed + notarized) ─────────────────────────────
  # Runs on the self-hosted Mac runner — Developer ID Application cert is
  # already in the local Keychain, no p12 export or CSC_LINK needed.
  build-mac:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build, sign + notarize
        run: npm run dist:mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          aws s3 sync release/ s3://$R2_BUCKET/releases/ \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" \
            --include "*.dmg" \
            --include "*.dmg.blockmap" \
            --include "latest-mac.yml" \
            --no-progress

  # ── Windows (x64 NSIS installer) ──────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build + package
        run: npm run dist:win

      - name: Upload artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        shell: bash
        run: |
          aws s3 sync release/ s3://$R2_BUCKET/releases/ \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" \
            --include "*.exe" \
            --include "*.exe.blockmap" \
            --include "latest.yml" \
            --no-progress
