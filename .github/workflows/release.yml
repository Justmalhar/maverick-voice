name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # ── macOS (arm64 DMG, signed + notarized) ─────────────────────────────
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Verify the p12 contains both a certificate AND a private key.
      # If this prints only "Certificate bag" with no "Key bag", the .p12
      # was exported without the private key — re-export from Keychain Access
      # by right-clicking the Developer ID Application certificate (not the
      # key icon below it) and choosing Export.
      - name: Verify p12 contains private key
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          echo "$CSC_LINK" | base64 -d > /tmp/check.p12
          openssl pkcs12 -in /tmp/check.p12 -passin "pass:$CSC_KEY_PASSWORD" -nokeys -noout 2>&1 && echo "✓ Certificate found"
          openssl pkcs12 -in /tmp/check.p12 -passin "pass:$CSC_KEY_PASSWORD" -nocerts -noout 2>&1 && echo "✓ Private key found"
          rm /tmp/check.p12

      - name: Build, sign + notarize
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws s3 sync release/ s3://$R2_BUCKET/releases/ \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" \
            --include "*.dmg" \
            --include "*.dmg.blockmap" \
            --include "latest-mac.yml" \
            --no-progress

  # ── Windows (x64 NSIS installer) ──────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build + package
        run: npm run dist:win

      - name: Upload artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        shell: bash
        run: |
          aws s3 sync release/ s3://$R2_BUCKET/releases/ \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" \
            --include "*.exe" \
            --include "*.exe.blockmap" \
            --include "latest.yml" \
            --no-progress
