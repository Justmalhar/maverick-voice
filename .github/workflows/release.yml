name: Release

# Triggers on version tags: git tag v1.2.3 && git push --follow-tags
# Or manually via Actions → Run workflow (useful for testing the pipeline).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # ── macOS (arm64 DMG, signed + notarized) ─────────────────────────────
  build-mac:
    runs-on: macos-14   # arm64 runner — matches our arm64 build target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Explicitly import the Developer ID certificate into a temporary keychain
      # so electron-builder can auto-discover it. Passing CSC_LINK directly to
      # electron-builder silently fails on macos-14 runners.
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH

          security create-keychain -p "temp-keychain-password" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "temp-keychain-password" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp-keychain-password" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build, sign + notarize
        run: npm run dist:mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db

      - name: Upload artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws s3 sync release/ s3://$R2_BUCKET/releases/ \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" \
            --include "*.dmg" \
            --include "*.dmg.blockmap" \
            --include "latest-mac.yml" \
            --no-progress

  # ── Windows (x64 NSIS installer) ──────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build + package
        run: npm run dist:win

      - name: Upload artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        shell: bash
        run: |
          aws s3 sync release/ s3://$R2_BUCKET/releases/ \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" \
            --include "*.exe" \
            --include "*.exe.blockmap" \
            --include "latest.yml" \
            --no-progress
